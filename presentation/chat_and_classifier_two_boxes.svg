<svg width="100%" viewBox="0 0 1146 146" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Chat model and classifier model</title>
<desc>Two boxes side by side, labelled "Chat model" and "Classifier model".</desc>

<!-- Drawn 1:1 into a 1146px-wide slot, so 1 unit here = 1 canvas px.
     22pt = 29.3px, so no font below 30.  The prose that used to sit under the
     boxes moved into an HTML <ol> on the slide (2026-08-16): centred running
     text read worse than a left-aligned numbered list. -->
<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">

  <rect x="60" y="8" width="470" height="130" rx="12"
        fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="1"/>
  <text x="295" y="73" text-anchor="middle" dominant-baseline="central"
        font-size="34" font-weight="600" fill="rgb(68, 68, 65)">Chat model</text>

  <rect x="616" y="8" width="470" height="130" rx="12"
        fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <text x="851" y="73" text-anchor="middle" dominant-baseline="central"
        font-size="34" font-weight="600" fill="rgb(60, 52, 137)">Classifier model</text>

</g>
</svg>
