<svg width="100%" viewBox="0 0 1146 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Chat model and classifier model</title>
<desc>Two boxes side by side, labelled "Chat model" and "Classifier model", with the note that the classifier can stop the conversation mid-stream.</desc>

<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">

  <rect x="60" y="20" width="470" height="150" rx="12"
        fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="1"/>
  <text x="295" y="95" text-anchor="middle" dominant-baseline="central"
        font-size="34" font-weight="600" fill="rgb(68, 68, 65)">Chat model</text>

  <rect x="616" y="20" width="470" height="150" rx="12"
        fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="1"/>
  <text x="851" y="95" text-anchor="middle" dominant-baseline="central"
        font-size="34" font-weight="600" fill="rgb(60, 52, 137)">Classifier model</text>

  <text x="573" y="232" text-anchor="middle"
        font-size="30" font-weight="600" fill="rgb(44, 44, 42)">The classifier is able to stop the conversation mid-stream</text>

  <text x="573" y="290" text-anchor="middle"
        font-size="24" font-weight="500" fill="rgb(82, 81, 78)">Fable 5 classifier — no public jailbreak discovered — stops and reroutes<tspan x="573" dy="1.4em">20% of coding tasks on Terminal-Bench (June 2026)</tspan></text>

</g>
</svg>
