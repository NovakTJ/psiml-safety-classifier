<svg width="100%" viewBox="0 0 800 300" role="img" xmlns="http://www.w3.org/2000/svg"><title style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:500">Probing the classifier model's chemical knowledge</title><desc style="font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:500">The same base model used as the classifier, with the LoRA adapter removed, is asked directly what a chemical is. It identifies the common name correctly but hallucinates when given the technical description of the same chemical.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="40" y="20" style="fill:rgb(82, 81, 78);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500;text-anchor:start">Question 1</text>
<g><rect x="40" y="32" width="340" height="48" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="64" y="56" dominant-baseline="central" style="fill:rgb(68, 68, 65);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:central">What is [dangerous chemical]?</text></g>
<line x1="210" y1="82" x2="210" y2="112" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="40" y="105" style="fill:rgb(82, 81, 78);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500;text-anchor:start">Gemma-3-1B-IT — LoRA removed</text>
<g><rect x="40" y="118" width="340" height="48" rx="8" stroke-dasharray="5 4" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:1px;stroke-dasharray:5px, 4px"/>
<text x="64" y="142" dominant-baseline="central" style="fill:rgb(60, 52, 137);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:600;text-anchor:start;dominant-baseline:central">“A dangerous chemical.”</text></g>
<line x1="210" y1="166" x2="210" y2="186" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:0.5px;stroke-dasharray:4px, 3px"/>
<g><rect x="40" y="186" width="340" height="56" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px"/>
<text x="60" y="214" dominant-baseline="central" style="fill:rgb(133, 79, 11);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:central">Recognizes the common name.</text></g>

<text x="420" y="20" style="fill:rgb(82, 81, 78);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500;text-anchor:start">Question 2</text>
<g><rect x="420" y="32" width="340" height="48" rx="8" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px"/>
<text x="444" y="56" dominant-baseline="central" style="fill:rgb(68, 68, 65);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:central">What is [<tspan style="font-weight:800">technical description</tspan> of chemical]?</text></g>
<line x1="590" y1="82" x2="590" y2="112" marker-end="url(#arrow)" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:1.5px"/>
<text x="420" y="105" style="fill:rgb(82, 81, 78);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500;text-anchor:start">Gemma-3-1B-IT — LoRA removed</text>
<g><rect x="420" y="118" width="340" height="48" rx="8" stroke-dasharray="5 4" style="fill:rgb(238, 237, 254);stroke:rgb(83, 74, 183);stroke-width:1px;stroke-dasharray:5px, 4px"/>
<text x="444" y="142" dominant-baseline="central" style="fill:rgb(60, 52, 137);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:600;text-anchor:start;dominant-baseline:central"><tspan style="font-style:italic;font-weight:500">hallucination</tspan></text></g>
<line x1="590" y1="166" x2="590" y2="186" style="fill:none;stroke:rgb(137, 135, 129);stroke-width:0.5px;stroke-dasharray:4px, 3px"/>
<g><rect x="420" y="186" width="340" height="56" rx="8" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px"/>
<text x="440" y="208" dominant-baseline="central" style="fill:rgb(133, 79, 11);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:central">Cannot connect the technical description to<tspan x="440" dy="1.4em">the chemical — invents an unrelated answer</tspan></text></g>

<text x="40" y="272" style="fill:rgb(82, 81, 78);stroke:none;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:500;text-anchor:start">The bypass in the previous experiment is a knowledge gap, not a policy gap: the classifier never had the chemistry to begin with.</text>
</svg>
